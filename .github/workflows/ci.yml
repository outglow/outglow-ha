name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv .venv && .venv/bin/pip install -e '.[test,lint,ha]'
      - name: Contracts and README are up to date
        run: make contracts docs-check
      - run: make lint types test-engine test-ha

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix frontend ci
      - run: make frontend-test frontend

  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      PW_CHANNEL: chromium
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm --prefix frontend ci
      - name: Playwright on the mock
        working-directory: frontend
        run: npx playwright test
      - name: README images are up to date
        working-directory: frontend
        run: node scripts/shots.mjs --check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
