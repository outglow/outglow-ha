name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The tag matches manifest.json
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/outglow/manifest.json"))["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "manifest.json says $version, the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Build the panel and the card
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: outglow.zip (the content of custom_components/outglow, as hacs.json expects)
        run: |
          test -f custom_components/outglow/frontend/outglow-panel.js
          test -f custom_components/outglow/frontend/outglow-cards.js
          cd custom_components/outglow
          zip -r -X ../../outglow.zip . -x '*__pycache__*'
          cd ../..
          unzip -l outglow.zip
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" outglow.zip --title "Outglow for Home Assistant ${GITHUB_REF_NAME#v}" --generate-notes $pre
